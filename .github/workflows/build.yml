name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate gradlew if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
      - name: Create dummy google-services.json
        run: |
          PKG="com.zedtradejunction.app"
          if grep -q "applicationId" app/build.gradle*; then
            FOUND=$(grep -o 'applicationId.*"' app/build.gradle* | head -1 | cut -d'"' -f2)
            if [ ! -z "$FOUND" ]; then PKG=$FOUND; fi
          fi
          echo "Using package: $PKG"
          cat > app/google-services.json <<EOF
          {
            "project_info": {"project_number": "1234567890", "project_id": "dummy", "storage_bucket": "dummy.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:1234567890:android:abcdef", "android_client_info": {"package_name": "$PKG"}}, "oauth_client": [], "api_key": [{"current_key": "dummy"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
            "configuration_version": "1"
          }
          EOF
      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"
          ls -lh *.keystore app/*.keystore
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: zed-trade-junction-apk
          path: app/build/outputs/apk/debug/app-debug.apk
